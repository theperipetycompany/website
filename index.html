<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <title>The Peripety Company</title>
  <meta name="description" content="Building adventurous software." />
  <meta property="og:site_name" content="The Peripety Company" />
  <meta property="og:title" content="The Peripety Company" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Building adventurous software." />
  <meta property="og:image" content="https://theperipetycompany.com/assets/images/card.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="800" />
  <meta property="og:url" content="https://theperipetycompany.com" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="canonical" href="https://theperipetycompany.com" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lato:ital,wght@0,300;1,300" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body, div, span, h1, h2, p, a, img, ul, li {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }

    html {
      font-size: 18pt;
    }

    body {
      line-height: 1;
      min-height: 100vh;
      min-width: 320px;
      overflow-x: hidden;
      word-wrap: break-word;
      background-color: #000000;
      -webkit-text-size-adjust: none;
    }

    /* Full-screen fade-in curtain matching original Carrd load transition */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 3s ease-in-out 0s, visibility 3s 0s;
    }

    body.is-loading::after {
      opacity: 1;
      visibility: visible;
    }

    /* Background video & scrim */
    .site-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background-image: url('assets/videos/bg-poster.jpg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .site-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image: linear-gradient(to top, rgba(0, 0, 0, 0.678), rgba(0, 0, 0, 0.678));
    }

    .site-bg video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* Layout wrapper */
    .site-wrapper {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      min-height: 100vh;
      padding: 0 2.8125rem;
      position: relative;
      z-index: 2;
      overflow: hidden;
    }

    .site-main {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: transparent;
      max-width: 100%;
      opacity: 1;
      transition: opacity 1s ease-in-out 0s;
    }

    body.is-loading .site-main {
      opacity: 0;
    }

    .site-main > .inner {
      --spacing: 1.625rem;
      width: 43rem;
      max-width: 100%;
      padding: 3.75rem 3rem;
    }

    .site-main > .inner > * {
      margin-top: var(--spacing);
      margin-bottom: var(--spacing);
    }

    .site-main > .inner > :first-child {
      margin-top: 0 !important;
    }

    .site-main > .inner > :last-child {
      margin-bottom: 0 !important;
    }

    /* Logo */
    .logo-wrap .frame {
      display: inline-block;
      width: 35.375rem;
      max-width: 100%;
      vertical-align: top;
      overflow: hidden;
    }

    .logo-wrap .frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Quote */
    .quote {
      color: #C9C9C9;
      font-family: 'Lato', sans-serif;
      font-size: 0.875em;
      line-height: 1.625;
      font-weight: 300;
      letter-spacing: 0.025rem;
      width: calc(100% + 0.025rem);
    }

    /* Projects container */
    .projects-container {
      margin-top: 12rem !important;
    }

    .projects-container > .wrapper {
      display: inline-block;
      width: 35rem;
      max-width: 100%;
      background-color: transparent;
    }

    .projects-container > .wrapper > .inner {
      --spacing: 0.75rem;
      padding: 1.25rem 6rem;
    }

    .projects-container > .wrapper > .inner > * {
      margin-top: var(--spacing);
      margin-bottom: var(--spacing);
    }

    .projects-container > .wrapper > .inner > :first-child {
      margin-top: 0 !important;
    }

    .projects-container > .wrapper > .inner > :last-child {
      margin-bottom: 0 !important;
    }

    .tagline {
      color: #FFFFFF;
      font-family: 'Lato', sans-serif;
      font-size: 0.75em;
      line-height: 1.625;
      font-weight: 300;
      letter-spacing: 0.025rem;
      width: calc(100% + 0.025rem);
      margin-top: 2rem !important;
      margin-bottom: 2rem !important;
    }

    .projects-heading {
      color: #FFFFFF;
      font-family: 'Lato', sans-serif;
      font-size: 0.75em;
      line-height: 1.625;
      font-weight: 300;
      letter-spacing: 0.025rem;
      width: calc(100% + 0.025rem);
    }

    .project-link-list {
      list-style: none;
      margin-top: 0.75rem !important;
      margin-bottom: 0.75rem !important;
      font-family: 'Lato', sans-serif;
      font-size: 0.625em;
      line-height: 1.5;
      font-weight: 300;
      letter-spacing: 0.025rem;
      width: calc(100% + 0.025rem);
    }

    .project-link-list li {
      display: inline-block;
    }

    .project-link-list a {
      color: #C9C9C9;
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .project-link-list a:hover,
    .project-link-list a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .project-item {
      color: #C9C9C9;
      font-family: 'Lato', sans-serif;
      font-size: 0.625em;
      line-height: 1.625;
      font-weight: 300;
      letter-spacing: 0.025rem;
      width: calc(100% + 0.025rem);
    }

    /* Exact responsive scale matching Carrd breakpoints */
    @media (max-width: 1680px) {
      html {
        font-size: 13pt;
      }
    }

    @media (max-width: 1280px) {
      html {
        font-size: 13pt;
      }
    }

    @media (max-width: 980px) {
      html {
        font-size: 11pt;
      }
    }

    @media (max-width: 736px) {
      html {
        font-size: 11pt;
      }

      .site-main > .inner {
        padding: 3.5rem 2rem;
      }

      .quote {
        font-size: 0.625em;
        letter-spacing: 0.021875rem;
        width: calc(100% + 0.021875rem);
      }

      .projects-container {
        margin-top: 8.5rem !important;
      }

      .projects-container > .wrapper > .inner {
        padding: 1.25rem 2rem;
      }

      .tagline {
        font-size: 0.625em;
        letter-spacing: 0.021875rem;
        width: calc(100% + 0.021875rem);
        margin-top: 1.5rem !important;
        margin-bottom: 1.5rem !important;
      }

      .projects-heading {
        font-size: 0.625em;
        letter-spacing: 0.021875rem;
        width: calc(100% + 0.021875rem);
      }

      .project-link-list {
        letter-spacing: 0.021875rem;
        width: calc(100% + 0.021875rem);
        margin-top: 0.5625rem !important;
        margin-bottom: 0.5625rem !important;
      }

      .project-item {
        letter-spacing: 0.021875rem;
        width: calc(100% + 0.021875rem);
      }
    }

    @media (max-width: 480px) {
      .site-main > .inner {
        --spacing: 1.421875rem;
      }

      .projects-container > .wrapper > .inner {
        --spacing: 0.65625rem;
      }
    }

    @media (max-width: 360px) {
      .site-main > .inner {
        --spacing: 1.21875rem;
        padding: 2.625rem 1.5rem;
      }

      .projects-container > .wrapper > .inner {
        --spacing: 0.5625rem;
        padding: 0.9375rem 1.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after,
      .site-main {
        transition: none;
      }
    }
  </style>
</head>
<body class="is-loading">
  <div class="site-bg" aria-hidden="true">
    <video autoplay muted loop playsinline webkit-playsinline preload="auto" poster="assets/videos/bg-poster.jpg" disablepictureinpicture disableremoteplayback>
      <source src="assets/videos/bg.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="site-wrapper">
    <main class="site-main" role="main">
      <div class="inner">
        <div class="logo-wrap">
          <span class="frame">
            <img src="assets/images/logo.png" alt="the peripety company" width="1920" height="194" />
          </span>
        </div>

        <h1 class="quote">WE ARE SUCH STUFF AS DREAMS ARE MADE ON</h1>

        <div class="projects-container">
          <div class="wrapper">
            <div class="inner">
              <h2 class="tagline">Building adventurous software since 2020</h2>
              <h2 class="projects-heading">current projects:</h2>

              <ul class="project-link-list">
                <li><a href="https://heimursaga.com/about/">HEIMURSAGA</a></li>
              </ul>

              <p class="project-item">AMUNDSEN CALLIOPE</p>
              <p class="project-item">SAPIENCE</p>
              <p class="project-item">WCR</p>

              <ul class="project-link-list">
                <li><a href="https://docs.theperipetycompany.com/">PERSEUS INITIATIVE</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      function reveal() {
        window.setTimeout(function () {
          document.body.classList.remove('is-loading');
        }, 100);
      }
      if (document.readyState === 'complete') {
        reveal();
      } else {
        window.addEventListener('load', reveal, { once: true });
      }
    })();
  </script>
</body>
</html>
